<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Crisp White with subtle Ice Blue gradient -->
    <linearGradient id="whiteBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f6ff"/>
    </linearGradient>

    <!-- Vibrant Cobalt Blue Gradient -->
    <linearGradient id="cobaltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a7aff"/>
      <stop offset="50%" stop-color="#0057e7"/>
      <stop offset="100%" stop-color="#0041b3"/>
    </linearGradient>

    <!-- Secondary Architectural Blue Gradient -->
    <linearGradient id="softBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70a6ff"/>
      <stop offset="100%" stop-color="#0057e7"/>
    </linearGradient>

    <!-- Cobalt Glow Filter -->
    <filter id="cobaltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0057e7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Clean White Icon Base with Cobalt Blue Border -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#whiteBgGrad)" stroke="#0057e7" stroke-width="2.5"/>

  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="112" height="112" rx="22" fill="none" stroke="rgba(0, 87, 231, 0.15)" stroke-width="1"/>

  <g filter="url(#cobaltGlow)">
    <!-- Architectural Gable -->
    <path d="M64 24 L28 50 L34 54 L64 32 Z" fill="url(#softBlueGrad)"/>
    <path d="M64 24 L64 32 L94 54 L100 50 Z" fill="url(#cobaltGrad)"/>

    <!-- Pillar Accent -->
    <rect x="82" y="28" width="6" height="14" rx="1" fill="url(#cobaltGrad)"/>

    <!-- Letter R -->
    <path d="M38 52 H54 C60 52 64 55 64 61 C64 66 60 69 54 69 H46 V88 H38 V52 Z M46 63 H53 C55 63 56.5 62 56.5 60.5 C56.5 59 55 58 53 58 H46 V63 Z" fill="url(#cobaltGrad)"/>
    <path d="M52 68 L64 88 H54 L44 71 H50 Z" fill="url(#softBlueGrad)"/>

    <!-- Letter J -->
    <path d="M72 52 H80 V80 C80 85 76 89 70 89 C64 89 61 86 60 82 L67 80 C67.5 82 69 83 71 83 C72.5 83 73.5 82 73.5 80 V52 H72 Z" fill="url(#cobaltGrad)"/>

    <!-- Foundation Line in Cobalt Blue -->
    <rect x="30" y="93" width="68" height="3" rx="1.5" fill="url(#cobaltGrad)"/>

    <!-- Five-Star Quality Monogram Star in Cobalt Blue -->
    <polygon points="64,99 65.5,103 70,103 66.5,105.5 68,109.5 64,107 60,109.5 61.5,105.5 58,103 62.5,103" fill="url(#cobaltGrad)"/>
  </g>
</svg>
